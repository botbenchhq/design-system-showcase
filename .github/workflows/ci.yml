name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/fetch-upstream.mjs
      - run: node tools/build.mjs
      - name: Design system's static scan, over this site
        run: npm run check:design
      - name: Links, assets and previews, and every outside address
        run: node tools/check.mjs --online
      - name: Browser checks in Chromium, Firefox and WebKit
        run: |
          npx playwright install --with-deps chromium firefox webkit
          node tools/social-preview.mjs
          node tools/check-browser.mjs
        env:
          BROWSERS: chromium,firefox,webkit
          SHOTS: "1"
      - name: Keep reproducible showcase captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: showcase-captures-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src/assets/social-preview.png
            shots/components-1280-dark.png
            shots/components-approval-390-light.png
            shots/get-started-390-dark.png
            shots/index-1280-dark.png
            shots/index-1280-light.png
            shots/index-390-dark.png
            shots/rules-1280-light.png
            shots/themes-1280-dark.png
