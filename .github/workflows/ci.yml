name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/fetch-upstream.mjs
      - run: node tools/build.mjs
      - name: Design system's static scan, over this site
        run: npm run check:design
      - name: Links, assets and previews, and every outside address
        run: node tools/check.mjs --online
      - name: Browser checks in Chromium, Firefox and WebKit
        run: |
          npx playwright install --with-deps chromium firefox webkit
          node tools/check-browser.mjs
        env:
          BROWSERS: chromium,firefox,webkit
          SHOTS: "0"
